# Tests for every library on every push / pull request, against
# tools/nebulosa_sim.py (no hardware needed).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python: ["3.8", "3.12"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e "./python[numpy,test]"
      - name: Tests
        run: python -m pytest -v python/tests
      - name: Build wheel and sdist
        if: matrix.os == 'ubuntu-22.04' && matrix.python == '3.12'
        run: |
          python -m pip install build
          python -m build python --outdir dist
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-22.04' && matrix.python == '3.12'
        with:
          name: python-dist
          path: dist/

  c-cpp:
    name: C / C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows (MSVC, TCP only) has not been verified yet: report, don't block.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: libusb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - name: libusb (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb pkg-config
      - name: Configure
        shell: bash
        run: |
          usb=ON
          [ "$RUNNER_OS" = Windows ] && usb=OFF
          cmake -S c -B c/build -DCMAKE_BUILD_TYPE=Release -DNEBULOSA_USB=$usb
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DNEBULOSA_USB=$usb
      - name: Build
        run: |
          cmake --build c/build --config Release
          cmake --build cpp/build --config Release
      - name: Test C
        working-directory: c/build
        run: ctest -C Release --output-on-failure
      - name: Test C++
        working-directory: cpp/build
        run: ctest -C Release --output-on-failure

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: libusb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - name: Tests (TCP, simulator)
        shell: bash
        env:
          NEBULOSA_PYTHON: python
        run: cargo test
      - name: USB feature, clippy, docs
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo build --features usb --all-targets
          cargo clippy --all-features --all-targets -- -D warnings
          cargo doc --no-deps --all-features

  rust-msrv:
    name: Rust 1.74 (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74
      - run: cargo build
        working-directory: rust

  odin:
    name: Odin (experimental)
    runs-on: ubuntu-latest
    # Written without a compiler: this job is where it gets compiled. It
    # reports, it doesn't block, until it is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@v2
        with:
          release: latest
      - name: libusb
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - name: Unit tests
        run: odin test odin/tests -collection:nebulosa=odin
      - name: Simulator tests
        run: |
          python3 tools/nebulosa_sim.py --port 21000 --no-udp &
          sleep 1
          NEBULOSA_SIM_PORT=21000 odin test odin/tests -collection:nebulosa=odin
      - name: Examples (TCP and USB builds)
        run: |
          for ex in info stream_csv average_current; do
            odin build odin/examples/$ex -collection:nebulosa=odin -out:/tmp/$ex
            odin build odin/examples/$ex -collection:nebulosa=odin -define:NEBULOSA_USB=true -out:/tmp/${ex}_usb
          done

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: libusb (for the usb feature's docs)
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - name: Rust API docs (linked from the site)
        working-directory: rust
        run: cargo doc --no-deps --all-features
      - name: Site
        run: |
          mkdir -p docs/api
          cp -r rust/target/doc docs/api/rust
          pip install -r docs/requirements.txt
          mkdocs build --strict
