site_name: Nebulosa developer libraries
site_description: Script the INSTRIX Nebulosa power profiler from Python, C, C++, Rust and Odin.
site_url: https://instrix.github.io/Instrix-Nebulosa-Libs/
repo_url: https://github.com/Instrix/Instrix-Nebulosa-Libs
repo_name: Instrix/Instrix-Nebulosa-Libs
edit_uri: edit/main/docs/
copyright: INSTRIX

# api/rust/ is generated by `cargo doc` in the docs workflow (not in git)
exclude_docs: |
  requirements.txt
not_in_nav: |
  api/**

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }
  - tables
  - toc: { permalink: true }

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Guides:
      - Python: guides/python.md
      - C: guides/c.md
      - C++: guides/cpp.md
      - Rust: guides/rust.md
      - Odin: guides/odin.md
  - Simulator: simulator.md
  - Troubleshooting: troubleshooting.md
  - Reference:
      - Protocol & API contract: API.md
      - Rust API docs: api/rust/nebulosa/index.html
  - Contributing: contributing.md
